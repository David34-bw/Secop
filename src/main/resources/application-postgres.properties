# Perfil opcional para usar PostgreSQL en vez de H2.
# Actívalo en IntelliJ (Run configuration > Active profiles: postgres)
# o con: mvnw spring-boot:run -Dspring-boot.run.profiles=postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/secop_radar
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.h2.console.enabled=false
