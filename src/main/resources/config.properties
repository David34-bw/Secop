# ---------------------------------------------------------------
# SECOP RADAR - configuración de la aplicación de escritorio
# ---------------------------------------------------------------

# --- Base de datos ---
# Supabase (PostgreSQL en la nube), proyecto Project_Two, esquema "secop".
# Session pooler: funciona en redes sin IPv6. La CONTRASEÑA no va aquí: va en
# config.local.properties (carpeta del proyecto), que no se sube a GitHub.
# Cómo llega la app a los datos:
#   jdbc = PostgreSQL de Supabase (puerto 5432; necesita bd.password en config.local.properties)
#   api  = por HTTPS (puerto 443) con la Edge Function "api"; para redes que bloquean PostgreSQL.
#          Solo necesita api.clave (abajo); no necesita la contraseña de la base.
bd.modo=api
api.url=https://dfsrvpplxueujiezdogi.supabase.co/functions/v1/api
# Clave publishable de Supabase: es pública por diseño (como en cualquier página web). Solo deja
# llamar a la función; los datos piden sesión y la base no se puede leer con ella (RLS).
api.clave=sb_publishable_jdIf4wcVU-sE-pp5Z4xyBQ_wqVevG_L
bd.url=jdbc:postgresql://aws-1-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require&currentSchema=secop&reWriteBatchedInserts=true&ApplicationName=SECOP%20RADAR
bd.usuario=postgres.dfsrvpplxueujiezdogi
# Esquema de las tablas en Supabase (no expuesto por la API pública).
bd.esquema=secop

# Respaldo: base local H2 en ./data/secop.mv.db. Se usa si no hay contraseña
# de Supabase o no hay conexión a internet.
bd.local.url=jdbc:h2:file:./data/secop;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE

# --- Datos de SECOP II (datos.gov.co / Socrata) ---
# Token opcional: sin él la API funciona pero con un límite más bajo.
socrata.app-token=
# Días hacia atrás que descarga cada actualización.
ingesta.dias-atras=5
# Al abrir la app, si la base no tiene procesos, descarga los últimos N días.
ingesta.al-iniciar=true
ingesta.dias-primera-vez=7
# Hora (0-23, hora de Colombia) de la actualización diaria mientras la app esté abierta.
actualizacion.hora=21

# Correo de contacto que aparece en los documentos legales.
correo-contacto=contacto@secop-radar.local
