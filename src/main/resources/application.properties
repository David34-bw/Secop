# ---------------------------------------------------------------
# SECOP RADAR (versión Java) - configuración local
# Cualquier valor se puede sobrescribir con variables de entorno,
# por ejemplo SECOP_SOCRATA_APP_TOKEN o SPRING_MAIL_HOST.
# ---------------------------------------------------------------
spring.application.name=secop-radar
server.port=8080

# Base de datos H2 en archivo: queda en ./data/secop.mv.db
# (no hay que instalar nada). Para PostgreSQL ver application-postgres.properties.
spring.datasource.url=jdbc:h2:file:./data/secop;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Consola web de H2 en http://localhost:8080/h2-console
# (JDBC URL: jdbc:h2:file:./data/secop  usuario: sa  sin contraseña)
spring.h2.console.enabled=true

# Sesión
server.servlet.session.timeout=7d
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true
server.servlet.session.tracking-modes=cookie

spring.thymeleaf.cache=false
spring.jackson.time-zone=America/Bogota

# --- Datos de SECOP II (datos.gov.co / Socrata) ---
# Token opcional: sin él la API funciona pero con un límite más bajo.
secop.socrata-app-token=
# Días hacia atrás que descarga cada corrida diaria.
secop.ingesta.dias-atras=5
# Al arrancar, si la base no tiene procesos, descarga los últimos N días.
secop.ingesta.al-iniciar=true
secop.ingesta.dias-primera-vez=7
# Cron diario (segundo minuto hora día mes día-semana), hora de Colombia.
# El original corría a las 02:00 UTC = 9:00 p. m. en Colombia.
secop.cron=0 0 21 * * *

# --- Marca / URLs ---
secop.app-url=http://localhost:8080
# Correo de contacto que aparece en los documentos legales.
secop.correo-contacto=contacto@secop-radar.local
# Clave para firmar los enlaces de "dejar de recibir alertas".
secop.secreto=cambia-esta-clave-en-produccion

# --- Correo (opcional) ---
# Sin servidor SMTP la app funciona igual: solo no envía alertas.
# Ejemplo con Gmail (requiere contraseña de aplicación):
#   spring.mail.host=smtp.gmail.com
#   spring.mail.port=587
#   spring.mail.username=tu-correo@gmail.com
#   spring.mail.password=tu-contraseña-de-aplicacion
#   spring.mail.properties.mail.smtp.auth=true
#   spring.mail.properties.mail.smtp.starttls.enable=true
secop.alertas.enviar=false
secop.alertas.max-correos-dia=400

logging.level.co.secopradar=INFO
