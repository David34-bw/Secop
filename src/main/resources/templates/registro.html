<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Crear cuenta')}"></head>
<body class="fondo-suave">
<main class="centro">
    <div class="caja-auth">
        <a href="/" class="logo logo-centro">
            <img src="/img/logo-secop-radar-120.png" alt="" width="32" height="32">
            <span>SECOP <b>RADAR</b></span>
        </a>
        <h1>Crea tu cuenta</h1>
        <p class="apagado centro-texto" th:text="${diasPrueba} + ' días del plan Profesional gratis. Sin tarjeta.'"></p>
        <p th:if="${error}" class="aviso aviso-error" th:text="${error}"></p>
        <form method="post" action="/registro" class="formulario" id="form-registro" novalidate>
            <label class="etiqueta" for="nombre">Nombre (opcional)</label>
            <input class="campo" id="nombre" name="nombre" maxlength="200" autocomplete="name" th:value="${nombre}">
            <label class="etiqueta" for="email">Correo</label>
            <input class="campo" id="email" name="email" type="email" required maxlength="254" autocomplete="email"
                   th:value="${email}" aria-describedby="email-error">
            <p id="email-error" class="error-campo oculto" aria-live="polite"></p>
            <label class="etiqueta" for="password">Contraseña</label>
            <input class="campo" id="password" name="password" type="password" required minlength="8" autocomplete="new-password">
            <p class="texto-chico apagado">Mínimo 8 caracteres.</p>
            <label class="casilla">
                <input type="checkbox" name="acepto" value="true" required>
                <span>Acepto los <a href="/terminos" target="_blank">Términos y condiciones</a> y autorizo el tratamiento de mis datos según la
                <a href="/privacidad" target="_blank">Política de datos personales</a>.</span>
            </label>
            <button type="submit" class="boton boton-ambar ancho-completo">Crear cuenta</button>
        </form>
        <p class="texto-chico apagado centro-texto">¿Ya tienes cuenta? <a href="/login">Ingresa</a></p>
    </div>
</main>
<script src="/js/registro.js"></script>
</body>
</html>
